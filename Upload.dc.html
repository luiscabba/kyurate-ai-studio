<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload and quality score · Kyurate AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#5A5A5A}
@keyframes kyUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kyFade{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
header{animation:kyFade .5s ease both}
h1{animation:kyUp .6s .05s cubic-bezier(.2,.7,.2,1) both}
section,aside,figure,article{animation:kyUp .6s .12s cubic-bezier(.2,.7,.2,1) both}
aside{animation-delay:.2s}
a,button,label{transition:transform .18s ease,background-color .2s ease,box-shadow .2s ease,border-color .2s ease,color .2s ease}
button:not(:disabled):hover,a[href]:hover{transform:translateY(-1px)}
button:not(:disabled):active,a[href]:active{transform:scale(.97);transition-duration:.08s}
img{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
a:hover img,button:hover img,figure:hover img{transform:scale(1.04)}
:focus-visible{outline:2px solid #1A1A1A;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>html,body{margin:0;background:#F3F1EC}</style>
</head>
<body>
<div id="root"></div>
<template id="dc-template">

<div style="position: relative; min-height: 960px; overflow: hidden; background: #F3F1EC; font-family: 'Inter', sans-serif; color: #1A1A1A">
<svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><defs><pattern id="changsal-light" width="120" height="120" patternUnits="userSpaceOnUse"><rect x="0.5" y="0.5" width="119" height="119" fill="none" stroke="#1A1A1A" stroke-opacity="0.05"></rect><path d="M60 0V120M0 60H120M30 30H90V90H30Z" fill="none" stroke="#1A1A1A" stroke-opacity="0.04"></path></pattern></defs><rect width="100%" height="100%" fill="url(#changsal-light)"></rect></svg>
<div style="position: absolute; right: 28px; bottom: 18px; z-index: 5; font-size: 11px; letter-spacing: 0.06em; color: rgba(26,26,26,0.45); pointer-events: none">Developed by <span style="font-weight: 600; color: rgba(26,26,26,0.7)">texxen</span></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 32px; padding: 24px 40px 56px; max-width: 1320px; margin: 0 auto; box-sizing: border-box">
<header style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px; padding: 12px 16px; border-radius: 999px; background: rgba(255,255,255,0.55); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255,255,255,0.8); box-shadow: inset 0 1px 0 #FFFFFF, 0 10px 30px rgba(26,26,26,0.08)">
<nav aria-label="Steps" style="display: flex; flex-wrap: wrap; gap: 2px; font-size: 11px; letter-spacing: 0.08em">
<span style="padding: 7px 12px; border-radius: 999px; background: #1A1A1A; color: #FFFFFF; font-weight: 600">UPLOAD</span>
<a href="Lock.dc.html" style="padding: 7px 12px; color: #8A8A8A; text-decoration: none">LOCK</a>
<a href="Setup.dc.html" style="padding: 7px 12px; color: #8A8A8A; text-decoration: none">SETUP</a>
<a href="Preview.dc.html" style="padding: 7px 12px; color: #8A8A8A; text-decoration: none">PREVIEW</a>
<a href="Generate.dc.html" style="padding: 7px 12px; color: #8A8A8A; text-decoration: none">GENERATE</a>
<a href="Review.dc.html" style="padding: 7px 12px; color: #8A8A8A; text-decoration: none">REVIEW</a>
</nav>
<a href="HomeMix.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 24px; letter-spacing: 0.02em; line-height: 1">KYURATE</span>
<span style="font-size: 9px; letter-spacing: 0.32em; color: #5A5A5A">AI STUDIO</span>
</a>
<div style="display: flex; justify-content: flex-end; font-size: 11px; letter-spacing: 0.08em; color: #5A5A5A; padding-right: 12px">BLACK SATIN SLIP DRESS</div>
</header>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding: 0 8px">
<h1 style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 400; font-size: 40px">Upload</h1>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #5A5A5A">DETECTED: DRESS</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<figure style="margin: 0; flex: 1 1 280px; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; aspect-ratio: 3 / 4; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 30px rgba(26,26,26,0.12)">
<img src="assets/d1.jpg" alt="Front photo of the dress laid flat" style="width: 100%; height: 100%; object-fit: cover; display: block">
<span style="position: absolute; left: 12px; top: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: {{frontTagColor}}">{{frontTag}}</span>
</div>
<figcaption style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; padding-left: 8px">FRONT</figcaption>
</figure>
<figure style="margin: 0; flex: 1 1 280px; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{noBack}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{addBack}}" style="width: 100%; aspect-ratio: 3 / 4; border-radius: 24px; border: 1.5px dashed rgba(26,26,26,0.25); background: rgba(255,255,255,0.45); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #1A1A1A; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 20h16"></path></svg>
ADD BACK PHOTO
</button></sc-if>
<sc-if value="{{hasBack}}" hint-placeholder-val="{{false}}"><div style="position: relative; aspect-ratio: 3 / 4; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 30px rgba(26,26,26,0.12)"><img src="assets/d2.jpg" alt="Back photo of the dress laid flat" style="width: 100%; height: 100%; object-fit: cover; display: block"><button type="button" onClick="{{removeBack}}" aria-label="Remove back photo" style="position: absolute; right: 12px; top: 12px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.8); cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div></sc-if>
<figcaption style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; padding-left: 8px">BACK <sc-if value="{{noBack}}" hint-placeholder-val="{{true}}"><span style="color: #A3341A; font-weight: 400; letter-spacing: 0; font-size: 12px">required for back-view shots</span></sc-if></figcaption>
</figure>
</div>
</section>
<aside style="flex: 1 1 340px; max-width: 420px; display: flex; flex-direction: column; gap: 14px; margin-top: 64px">
<div style="padding: 24px; border-radius: 28px; display: flex; flex-direction: column; gap: 18px; background: rgba(255,255,255,0.5); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 #FFFFFF, 0 10px 30px rgba(26,26,26,0.06)">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #5A5A5A">QUALITY SCORE</span>
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-size: 56px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums">{{score}}</span>
<span style="font-size: 14px; color: #5A5A5A">/ 100</span>
<span style="margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: {{scoreColor}}">{{scoreTag}}</span>
</div>
<div style="height: 4px; border-radius: 2px; background: rgba(26,26,26,0.08)"><div style="width: {{scorePct}}; height: 4px; border-radius: 2px; background: {{scoreColor}}; transition: width .6s cubic-bezier(.2,.7,.2,1), background-color .3s ease"></div></div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{checks}}" as="c" hint-placeholder-count="5">
<li style="display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid rgba(26,26,26,0.08)">
<sc-if value="{{c.ok}}" hint-placeholder-val="{{true}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F5E3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M5 12l5 5 9-10"></path></svg>
</sc-if>
<sc-if value="{{c.bad}}" hint-placeholder-val="{{false}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3341A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 14px; font-weight: 500">{{c.label}}</span>
<span style="font-size: 12px; line-height: 17px; color: #5A5A5A">{{c.note}}</span>
</div>
</li>
</sc-for>
</ul>
</div>
<button type="button" onClick="{{reshoot}}" style="height: 48px; border: 1px solid {{reshootBorder}}; border-radius: 999px; background: {{reshootBg}}; color: {{reshootFg}}; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; cursor: pointer">{{reshootLabel}}</button>
<sc-if value="{{notPassing}}" hint-placeholder-val="{{true}}"><button type="button" disabled style="width: 100%; height: 48px; border: 1px solid rgba(26,26,26,0.15); border-radius: 999px; background: rgba(255,255,255,0.4); color: #8A8A8A; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.08em">CONTINUE TO LOCK</button></sc-if>
<sc-if value="{{passing}}" hint-placeholder-val="{{false}}"><a href="Lock.dc.html" style="height: 48px; border-radius: 999px; background: #1A1A1A; color: #FFFFFF; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-decoration: none; display: flex; align-items: center; justify-content: center">CONTINUE TO LOCK</a></sc-if>
</aside>
</div>
</div>
</div>
</template>
<script id="dc-script" type="text/plain">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { reshot: false, back: false };
}
renderVals() {
const { reshot, back } = this.state;
const c = (ok, label, note) => ({ ok, bad: !ok, label, note });
const score = 62 + (reshot ? 16 : 0) + (back ? 14 : 0);
const passing = score >= 75;
return {
score,
scorePct: score + '%',
scoreTag: passing ? 'READY' : 'BELOW 75',
scoreColor: passing ? '#1F5E3D' : '#A3341A',
passing,
notPassing: !passing,
frontTag: reshot ? 'RESHOT' : 'HARD SHADOWS',
frontTagColor: reshot ? '#1F5E3D' : '#A3341A',
noBack: !back,
hasBack: back,
addBack: () => this.setState({ back: true }),
removeBack: () => this.setState({ back: false }),
reshoot: () => this.setState({ reshot: !reshot }),
reshootLabel: reshot ? 'UNDO RESHOOT' : 'UPLOAD RESHOOT',
reshootBg: reshot ? 'rgba(255,255,255,0.55)' : '#1A1A1A',
reshootFg: reshot ? '#1A1A1A' : '#FFFFFF',
reshootBorder: reshot ? 'rgba(26,26,26,0.15)' : '#1A1A1A',
checks: [
c(true, 'Resolution', '3024 x 4032'),
c(true, 'Full garment in frame', 'Straps to hem visible'),
c(reshot, 'Even lighting', reshot ? 'Soft, even light' : 'Window blind shadows across the fabric. Reshoot in shade or by a window on a cloudy day.'),
c(true, 'Wrinkles', 'Light, acceptable'),
c(back, 'Back view', back ? 'Added' : 'Missing. Lay it flat face down and shoot from above.')
]
};
}
}
</script>
<script type="module">import { mount } from './vendor/dc.js'; mount();</script>
</body>
</html>
