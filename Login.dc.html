<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin sign in · Kyurate AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#5A5A5A}
@keyframes kyCellIn{from{opacity:0;transform:translateY(-18px) scale(.85)}to{opacity:1;transform:none}}
@keyframes kyLetter{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes kyUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes kyDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes kyDraw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes kyBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ky-cell{display:block;cursor:pointer;animation:kyCellIn .6s cubic-bezier(.3,1.35,.5,1) both}
.ky-card{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{transform:rotateY(180deg)}
.tile{display:block;box-sizing:border-box;border-radius:22%;overflow:hidden}
.cream{background:radial-gradient(130% 130% at 25% 15%,#F7F2E8 0%,#ECE5D8 55%,#DCD3C2 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 3px rgba(120,100,70,.12),0 1px 0 #D9CFBD,0 2px 0 #D3C9B6,0 3px 0 #CDC2AE,0 4px 0 #C6BBA6,0 10px 14px rgba(60,45,25,.16)}
.black{background:radial-gradient(130% 130% at 25% 15%,#36332F 0%,#252321 55%,#1A1918 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 4px rgba(0,0,0,.3),0 1px 0 #171615,0 2px 0 #131211,0 3px 0 #0F0E0D,0 4px 0 #0B0B0A,0 10px 14px rgba(0,0,0,.24)}
.grain{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;opacity:.6;pointer-events:none}
.black .grain{mix-blend-mode:screen;opacity:.35}
.ky-letter{display:inline-block;animation:kyLetter .7s cubic-bezier(.2,.7,.2,1) both}
.ky-up{animation:kyUp .7s cubic-bezier(.2,.7,.2,1) both}
.ky-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#FFFFFF;animation:kyDot 1s ease-in-out infinite}
.ky-check{stroke-dasharray:60;animation:kyDraw .6s .1s ease-out both}
.ky-bar{transform-origin:left;animation:kyBar 2.1s cubic-bezier(.4,0,.2,1) both}
input{transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease}
input:focus{outline:none;border-color:#1A1A1A!important;box-shadow:0 0 0 4px rgba(26,26,26,.08);background-color:#FFFFFF!important}
a,button{transition:transform .18s ease,background-color .2s ease,box-shadow .2s ease,color .2s ease}
button:not(:disabled):hover,a[href]:hover{transform:translateY(-1px)}
button:not(:disabled):active,a[href]:active{transform:scale(.97);transition-duration:.08s}
:focus-visible{outline:2px solid #1A1A1A;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>html,body{margin:0;background:#F3F1EC}</style>
</head>
<body>
<div id="root"></div>
<template id="dc-template">

<div style="position: relative; min-height: 900px; overflow: hidden; background: #F3F1EC; font-family: 'Inter', sans-serif; color: #1A1A1A; display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box">
<svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><defs><pattern id="changsal-light" width="120" height="120" patternUnits="userSpaceOnUse"><rect x="0.5" y="0.5" width="119" height="119" fill="none" stroke="#1A1A1A" stroke-opacity="0.05"></rect><path d="M60 0V120M0 60H120M30 30H90V90H30Z" fill="none" stroke="#1A1A1A" stroke-opacity="0.04"></path></pattern></defs><rect width="100%" height="100%" fill="url(#changsal-light)"></rect></svg>
<div style="position: absolute; right: 28px; bottom: 18px; z-index: 5; font-size: 11px; letter-spacing: 0.06em; color: rgba(26,26,26,0.45); pointer-events: none">Developed by <span style="font-weight: 600; color: rgba(26,26,26,0.7)">texxen</span></div>
<svg width="0" height="0" aria-hidden="true" style="position: absolute"><filter id="kyGrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.37  0 0 0 0 0.3  1.2 0 0 0 -0.42"></feColorMatrix></filter></svg>
<div style="position: relative; width: 100%; max-width: 1080px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 72px">
<div style="flex: 1 1 360px; display: flex; flex-direction: column; align-items: center; gap: 40px">
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(5, 56px); gap: 10px; padding-bottom: 6px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="25">
<span class="ky-cell" onClick="{{c.onClick}}" onMouseMove="{{c.onMove}}" onMouseLeave="{{c.onLeave}}" style="width: 56px; height: 56px; perspective: 500px; animation-delay: {{c.delay}}">
<span class="ky-card" style="transform: {{c.transform}}; transition: {{c.transition}}">
<span class="face tile {{c.cls}}"><svg class="grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#kyGrain)"></rect></svg></span>
<span class="face back tile {{c.backCls}}"><svg class="grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#kyGrain)"></rect></svg></span>
</span>
</span>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<span aria-label="KYURATE" style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 44px; letter-spacing: 0.04em; line-height: 1">
<span class="ky-letter" style="animation-delay: 0.55s">K</span><span class="ky-letter" style="animation-delay: 0.61s">Y</span><span class="ky-letter" style="animation-delay: 0.67s">U</span><span class="ky-letter" style="animation-delay: 0.73s">R</span><span class="ky-letter" style="animation-delay: 0.79s">A</span><span class="ky-letter" style="animation-delay: 0.85s">T</span><span class="ky-letter" style="animation-delay: 0.91s">E</span>
</span>
<span class="ky-up" style="font-size: 11px; letter-spacing: 0.4em; color: #5A5A5A; animation-delay: 1.05s">AI STUDIO</span>
</div>
</div>
<div class="ky-up" style="flex: 0 1 400px; min-width: 300px; animation-delay: 0.3s">
<div style="position: relative; overflow: hidden; padding: 36px; border-radius: 32px; display: flex; flex-direction: column; gap: 22px; background: rgba(255,255,255,0.55); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255,255,255,0.9); box-shadow: inset 0 1px 0 #FFFFFF, 0 24px 60px rgba(26,26,26,0.1)">
<sc-if value="{{isLoading}}" hint-placeholder-val="{{false}}">
<span class="ky-bar" style="position: absolute; left: 0; top: 0; height: 3px; width: 100%; background: #1A1A1A"></span>
</sc-if>
<sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #5A5A5A">ADMIN</span>
<h1 style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 400; font-size: 34px">Sign in</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">EMAIL
<input type="email" autocomplete="username" value="{{email}}" onInput="{{onEmail}}" onKeyDown="{{onKey}}" disabled="{{isLoading}}" style="height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(26,26,26,0.12); background-color: rgba(255,255,255,0.7); font: inherit; font-size: 15px; font-weight: 400; letter-spacing: 0; color: #1A1A1A">
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">PASSWORD
<input type="password" autocomplete="current-password" value="{{pw}}" onInput="{{onPw}}" onKeyDown="{{onKey}}" disabled="{{isLoading}}" style="height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(26,26,26,0.12); background-color: rgba(255,255,255,0.7); font: inherit; font-size: 15px; font-weight: 400; letter-spacing: 0; color: #1A1A1A">
</label>
<button type="button" onClick="{{signIn}}" disabled="{{isLoading}}" style="height: 50px; margin-top: 6px; border: 0; border-radius: 999px; background-color: #1A1A1A; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px">
<sc-if value="{{notLoading}}" hint-placeholder-val="{{true}}">SIGN IN</sc-if>
<sc-if value="{{isLoading}}" hint-placeholder-val="{{false}}"><span class="ky-dot"></span><span class="ky-dot" style="animation-delay: .15s"></span><span class="ky-dot" style="animation-delay: .3s"></span></sc-if>
</button>
</div>
<button type="button" onClick="{{fillDemo}}" disabled="{{isLoading}}" style="align-self: center; height: 40px; padding: 0 16px; border: 1px solid rgba(26,26,26,0.12); border-radius: 999px; background-color: rgba(255,255,255,0.5); font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #1A1A1A; cursor: pointer">USE DEMO ACCOUNT</button>
</sc-if>
<sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
<div class="ky-up" style="display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 0; text-align: center">
<svg width="56" height="56" viewBox="0 0 56 56" fill="none" aria-hidden="true"><circle cx="28" cy="28" r="27" fill="#1A1A1A"></circle><path class="ky-check" d="M17 29l7 7 15-16" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<h1 style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 400; font-size: 32px">Welcome back</h1>
<a href="HomeMix.dc.html" style="height: 50px; padding: 0 32px; border-radius: 999px; background: #1A1A1A; color: #FFFFFF; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-decoration: none; display: flex; align-items: center">ENTER STUDIO</a>
<button type="button" onClick="{{reset}}" style="border: 0; background: transparent; font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #5A5A5A; cursor: pointer; padding: 8px">SIGN OUT</button>
</div>
</sc-if>
</div>
</div>
</div>
</div>
</template>
<script id="dc-script" type="text/plain">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { email: '', pw: '', phase: 'idle', pat: 0, flips: new Array(25).fill(0), tilt: { i: -1, rx: 0, ry: 0 } };
}
componentDidMount() {
this.iv = setInterval(() => { if (this.state.phase === 'idle') this.advance(); }, 2600);
}
componentWillUnmount() {
clearInterval(this.iv);
clearInterval(this.lv);
clearTimeout(this.t);
}
startSignIn() {
if (this.state.phase !== 'idle') return;
this.setState({ phase: 'loading' });
this.advance();
clearInterval(this.lv);
this.lv = setInterval(() => this.advance(), 700);
clearTimeout(this.t);
this.t = setTimeout(() => { clearInterval(this.lv); this.advance(0); this.setState({ phase: 'done' }); }, 2800);
}
pattern(p) {
const K = new Set([0, 5, 10, 15, 20, 11, 7, 3, 17, 23]);
const out = [];
for (let i = 0; i < 25; i++) {
const base = p < 2 ? K.has(i) : i === 12;
out.push(p % 2 === 0 ? base : !base);
}
return out;
}
advance(target) {
this.setState((s) => {
const next = target == null ? (s.pat + 1) % 4 : target;
const a = this.pattern(s.pat), b = this.pattern(next);
return { pat: next, flips: s.flips.map((f, i) => (a[i] !== b[i] ? f + 1 : f)) };
});
}
renderVals() {
const { email, pw, phase, pat, flips, tilt } = this.state;
const K = new Set(['0-0','1-0','2-0','3-0','4-0','2-1','1-2','0-3','3-2','4-3']);
const cells = [];
for (let r = 0; r < 5; r++) {
for (let c = 0; c < 5; c++) {
const i = r * 5 + c;
const lit = K.has(r + '-' + c);
const t = tilt.i === i ? tilt : { rx: 0, ry: 0 };
const tilting = tilt.i === i;
const lift = pat >= 2 && i === 12 ? 'translateZ(16px) ' : '';
cells.push({
cls: lit ? 'black' : 'cream',
backCls: lit ? 'cream' : 'black',
delay: ((r + c) * 0.05).toFixed(2) + 's',
transform: lift + (tilting ? 'translateZ(6px) ' : '') + 'rotateX(' + t.rx + 'deg) rotateY(' + (flips[i] * 180 + t.ry) + 'deg)',
transition: tilting ? 'transform .15s ease-out' : 'transform .8s cubic-bezier(.3,1.35,.5,1) ' + ((r + c) * 0.06).toFixed(2) + 's',
onClick: () => { if (phase === 'idle') this.advance(); },
onMove: (e) => {
const b = e.currentTarget.getBoundingClientRect();
const x = (e.clientX - b.left) / b.width - 0.5, y = (e.clientY - b.top) / b.height - 0.5;
this.setState({ tilt: { i, rx: Math.round(-y * 30), ry: Math.round(x * 30) } });
},
onLeave: () => this.setState({ tilt: { i: -1, rx: 0, ry: 0 } })
});
}
}
return {
cells,
email,
pw,
isLoading: phase === 'loading',
notLoading: phase !== 'loading',
isDone: phase === 'done',
notDone: phase !== 'done',
onEmail: (e) => this.setState({ email: e.target.value }),
onKey: (e) => { if (e.key === 'Enter' && this.state.phase === 'idle') this.startSignIn(); },
onPw: (e) => this.setState({ pw: e.target.value }),
fillDemo: () => this.setState({ email: 'admin@kyurate.demo', pw: 'demo-kyurate' }),
signIn: () => this.startSignIn(),
signInOld: () => {
this.setState({ phase: 'loading' });
this.advance();
clearInterval(this.lv);
this.lv = setInterval(() => this.advance(), 700);
clearTimeout(this.t);
this.t = setTimeout(() => { clearInterval(this.lv); this.advance(0); this.setState({ phase: 'done' }); }, 2800);
},
reset: () => this.setState({ phase: 'idle', email: '', pw: '' })
};
}
}
</script>
<script type="module">import { mount } from './vendor/dc.js'; mount();</script>
</body>
</html>
