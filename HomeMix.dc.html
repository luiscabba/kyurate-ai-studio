<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home, Kyurate glass · Kyurate AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#5A5A5A}
@keyframes kyUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kyFade{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes kyRise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
header{animation:kyFade .5s ease both}
h1{animation:kyUp .6s .05s cubic-bezier(.2,.7,.2,1) both}
section,aside,figure,article{animation:kyUp .6s .12s cubic-bezier(.2,.7,.2,1) both}
aside{animation-delay:.2s}
[role="img"] span{transform-origin:bottom;animation:kyRise .7s .35s cubic-bezier(.2,.7,.2,1) both}
a,button,label{transition:transform .18s ease,background-color .2s ease,box-shadow .2s ease,border-color .2s ease,color .2s ease}
button:not(:disabled):hover,a[href]:hover{transform:translateY(-1px)}
button:not(:disabled):active,a[href]:active{transform:scale(.97);transition-duration:.08s}
img{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
a:hover img,button:hover img,figure:hover img{transform:scale(1.04)}
:focus-visible{outline:2px solid #1A1A1A;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>html,body{margin:0;background:#F3F1EC}</style>
</head>
<body>
<div id="root"></div>
<template id="dc-template">

<div id="top" style="position: relative; min-height: 1120px; overflow: hidden; background: #F3F1EC; font-family: 'Inter', sans-serif; color: #1A1A1A">
<svg aria-hidden="true" viewBox="0 0 1440 1120" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%"><defs><pattern id="changsal-light" width="120" height="120" patternUnits="userSpaceOnUse"><rect x="0.5" y="0.5" width="119" height="119" fill="none" stroke="#1A1A1A" stroke-opacity="0.05"></rect><path d="M60 0V120M0 60H120M30 30H90V90H30Z" fill="none" stroke="#1A1A1A" stroke-opacity="0.04"></path></pattern></defs><rect width="1440" height="1120" fill="url(#changsal-light)"></rect></svg>
<div style="position: absolute; right: 28px; bottom: 18px; z-index: 5; font-size: 11px; letter-spacing: 0.06em; color: rgba(26,26,26,0.45); pointer-events: none">Developed by <span style="font-weight: 600; color: rgba(26,26,26,0.7)">texxen</span></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 32px; padding: 24px 40px 56px; max-width: 1320px; margin: 0 auto; box-sizing: border-box">
<header style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px; padding: 14px 16px 14px 28px; border-radius: 999px; background: rgba(255,255,255,0.55); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255,255,255,0.8); box-shadow: inset 0 1px 0 #FFFFFF, 0 10px 30px rgba(26,26,26,0.08)">
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 20px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase">
<a href="#top" style="text-decoration: none; font-weight: 600">Home</a>
<a href="#drafts" style="text-decoration: none">Drafts</a>
<a href="#projects" style="text-decoration: none">Projects</a>
<a href="#models" style="text-decoration: none">Models</a>
<a href="#costs" style="text-decoration: none">Usage</a>
</nav>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 24px; letter-spacing: 0.02em; line-height: 1">KYURATE</span>
<span style="font-size: 9px; letter-spacing: 0.32em; color: #5A5A5A">AI STUDIO</span>
</div>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px">
<a href="Login.dc.html" aria-label="Sign out" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.6); border: 1px solid rgba(26,26,26,0.12)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a>
<a href="Upload.dc.html" style="height: 40px; padding: 0 22px; border-radius: 999px; background: #1A1A1A; color: #FFFFFF; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-decoration: none; display: flex; align-items: center">NEW VIDEO</a>
</div>
</header>
<section style="display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0 0 0 8px; font-family: 'Playfair Display', serif; font-weight: 400; font-size: 40px">Studio</h1>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<div style="padding: 22px 24px; border-radius: 24px; display: flex; flex-direction: column; gap: 10px; background: rgba(255,255,255,0.5); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 #FFFFFF, 0 10px 30px rgba(26,26,26,0.06)">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5A5A5A">{{t.k}}</span>
<span style="font-size: 36px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums">{{t.v}}</span>
<span style="font-size: 13px; color: #5A5A5A">{{t.sub}}</span>
</div>
</sc-for>
</div>
</section>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<section style="padding: 24px; border-radius: 28px; display: flex; flex-direction: column; gap: 18px; background: rgba(255,255,255,0.5); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 #FFFFFF, 0 10px 30px rgba(26,26,26,0.06)">
<div style="display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap">
<h2 id="drafts" style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 400; font-size: 26px">Drafts</h2>
<div role="group" aria-label="Draft filter" style="display: flex; gap: 6px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button type="button" onClick="{{f.pick}}" style="border: 0; padding: 6px 12px; border-radius: 999px; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; cursor: pointer">{{f.label}}</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px">
<sc-for list="{{drafts}}" as="d" hint-placeholder-count="3">
<article style="display: flex; gap: 14px; padding: 10px; border-radius: 20px; background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.9)">
<img src="{{d.img}}" alt="" style="width: 80px; height: 106px; border-radius: 14px; object-fit: cover; flex: none">
<div style="display: flex; flex-direction: column; gap: 5px; min-width: 0; padding: 4px 0">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{d.labelColor}}">{{d.stage}}</span>
<span style="font-family: 'Playfair Display', serif; font-size: 17px; line-height: 1.3">{{d.name}}</span>
<span style="font-size: 12px; color: #5A5A5A">{{d.note}}</span>
<a href="{{d.href}}" style="margin-top: auto; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">RESUME</a>
</div>
</article>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: baseline; padding: 0 8px"><h2 id="projects" style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 400; font-size: 26px">Projects</h2></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="4">
<a href="Review.dc.html" style="text-decoration: none; position: relative; display: block; aspect-ratio: 4 / 5; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 30px rgba(26,26,26,0.12)">
<img src="{{p.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
<span style="position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 10px 12px; border-radius: 16px; background: rgba(255,255,255,0.7); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.9); display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5A5A5A">{{p.where}} · {{p.len}}</span>
<span style="font-family: 'Playfair Display', serif; font-size: 15px; line-height: 1.25; color: #1A1A1A">{{p.name}}</span>
</span>
</a>
</sc-for>
</div>
</section>
</div>
<aside style="flex: 1 1 340px; max-width: 420px; display: flex; flex-direction: column; gap: 24px">
<section style="padding: 24px; border-radius: 28px; display: flex; flex-direction: column; gap: 14px; background: rgba(255,255,255,0.5); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 #FFFFFF, 0 10px 30px rgba(26,26,26,0.06)">
<div style="display: flex; align-items: baseline"><h2 id="costs" style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 400; font-size: 22px">Costs</h2><span style="margin-left: auto; font-size: 11px; letter-spacing: 0.08em; color: #5A5A5A">OCTOBER · CREDITS</span></div>
<div role="img" aria-label="Daily spend, October 1 to 16" style="display: flex; align-items: flex-end; gap: 3px; height: 72px; border-bottom: 1px solid #1A1A1A">
<sc-for list="{{days}}" as="b" hint-placeholder-count="16">
<span title="{{b.tip}}" style="flex: 1; height: {{b.h}}; background: #1A1A1A; border-radius: 3px 3px 0 0"></span>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #5A5A5A; margin-top: -6px"><span>Oct 1</span><span>Oct 16</span></div>
<ul style="list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="5">
<li style="display: grid; grid-template-columns: 84px minmax(0, 1fr) 52px; align-items: center; gap: 12px; font-size: 13px">
<span>{{s.name}}</span>
<span style="height: 4px; border-radius: 2px; background: rgba(26,26,26,0.08); position: relative"><span style="position: absolute; left: 0; top: 0; height: 4px; border-radius: 2px; width: {{s.w}}; background: #1A1A1A"></span></span>
<span style="text-align: right">{{s.v}}</span>
</li>
</sc-for>
</ul>
</section>
<section style="padding: 24px; border-radius: 28px; display: flex; flex-direction: column; background: rgba(255,255,255,0.5); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 #FFFFFF, 0 10px 30px rgba(26,26,26,0.06)">
<div style="display: flex; align-items: baseline; padding-bottom: 8px"><h2 id="models" style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 400; font-size: 22px">Models</h2><button type="button" onClick="{{toggleConfig}}" style="margin-left: auto; border: 0; padding: 6px 12px; border-radius: 999px; background: {{configBg}}; color: {{configFg}}; font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; cursor: pointer">{{configLabel}}</button></div>
<sc-for list="{{models}}" as="m" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid rgba(26,26,26,0.08)">
<span style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #5A5A5A">{{m.stage}}</span>
<sc-if value="{{m.viewing}}" hint-placeholder-val="{{true}}"><span style="font-size: 14px">{{m.model}}</span></sc-if>
<sc-if value="{{m.editing}}" hint-placeholder-val="{{false}}"><select aria-label="{{m.stage}} model" value="{{m.model}}" onChange="{{m.onChange}}" style="height: 34px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(26,26,26,0.15); background: rgba(255,255,255,0.8); font: inherit; font-size: 13px; color: #1A1A1A"><sc-for list="{{m.options}}" as="o" hint-placeholder-count="2"><option value="{{o.v}}">{{o.v}}</option></sc-for></select></sc-if>
<span style="font-size: 11px; letter-spacing: 0.06em; color: {{m.statusColor}}">{{m.status}}</span>
</div>
</sc-for>
</section>
<section style="padding: 24px; border-radius: 28px; display: flex; flex-direction: column; gap: 14px; background: rgba(255,255,255,0.5); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 #FFFFFF, 0 10px 30px rgba(26,26,26,0.06)">
<h2 style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 400; font-size: 22px">Queue</h2>
<sc-for list="{{queue}}" as="q" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; font-size: 13px"><span>{{q.name}}</span><span style="margin-left: auto; color: #5A5A5A">{{q.eta}}</span></div>
<div style="height: 4px; border-radius: 2px; background: rgba(26,26,26,0.08)"><div style="height: 4px; border-radius: 2px; width: {{q.pct}}; background: #1A1A1A"></div></div>
</div>
</sc-for>
</section>
</aside>
</div>
</div>
</div>
</template>
<script id="dc-script" type="text/plain">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filter: 'all', editing: false, picks: { Video: 'Seedance 2.0', Keyframes: '[IMAGE MODEL]', QA: '[VISION MODEL]', Foley: 'Not set', Prompting: '[LLM]' } };
}
renderVals() {
const { filter, editing, picks } = this.state;
const filterDefs = [['all', 'ALL'], ['action', 'NEEDS ACTION'], ['setup', 'IN SETUP']];
const filters = filterDefs.map(([k, label]) => ({ label, bg: filter === k ? '#1A1A1A' : 'transparent', fg: filter === k ? '#FFFFFF' : '#5A5A5A', pick: () => this.setState({ filter: k }) }));
const optionSets = { Video: ['Seedance 2.0', 'Seedance 1.0 Pro'], Keyframes: ['[IMAGE MODEL]', 'Seedream'], QA: ['[VISION MODEL]'], Foley: ['Not set', '[AUDIO MODEL]'], Prompting: ['[LLM]'] };
const models = Object.keys(optionSets).map((stage) => {
const model = picks[stage];
const off = model === 'Not set';
return {
stage, model, editing, viewing: !editing,
options: optionSets[stage].map((v) => ({ v })),
status: off ? 'NOT SET' : 'ON', statusColor: off ? '#A3341A' : '#1A1A1A',
onChange: (e) => this.setState({ picks: Object.assign({}, this.state.picks, { [stage]: e.target.value }) })
};
});
const daily = [120, 0, 260, 310, 180, 0, 0, 420, 380, 290, 150, 0, 340, 460, 510, 420];
const max = Math.max(...daily);
const stagesRaw = [['Video', 2900], ['Keyframes', 380], ['Shot QA', 250], ['Foley', 220], ['Scoring', 110]];
const top = stagesRaw[0][1];
return {
filters,
models,
configLabel: editing ? 'DONE' : 'CONFIGURE',
configBg: editing ? '#1A1A1A' : 'transparent',
configFg: editing ? '#FFFFFF' : '#1A1A1A',
toggleConfig: () => this.setState({ editing: !editing }),
tiles: [
{ k: 'Credits left', v: '12,400', sub: 'About 58 videos' },
{ k: 'This month', v: '3,860', sub: '18 videos' },
{ k: 'Avg per video', v: '214', sub: 'Down 12% from Sept' },
{ k: 'Regenerated', v: '18%', sub: 'Mostly button and strap drift' }
],
drafts: [
{ stage: 'Review', labelColor: '#A3341A', name: 'Black satin slip dress', note: '1 shot failing QA', href: 'Review.dc.html', img: 'assets/d7.jpg' },
{ stage: 'Setup', labelColor: '#5A5A5A', name: 'Wide-leg jeans', note: 'Pick a storyboard', href: 'Setup.dc.html', img: 'assets/d1.jpg' },
{ stage: 'Upload', labelColor: '#A3341A', name: 'Knit cardigan', note: 'Reshoot needed', href: 'Upload.dc.html', img: 'assets/d3.jpg' }
].filter((d) => filter === 'all' || (filter === 'action' ? d.stage !== 'Setup' : d.stage === 'Setup')),
projects: [
{ name: 'Camel pea coat', where: 'TikTok', len: '0:15', img: 'assets/m1.jpg' },
{ name: 'Camel pea coat, alt', where: 'MP4', len: '0:10', img: 'assets/m2.jpg' },
{ name: 'Satin slip dress v1', where: 'MP4', len: '0:10', img: 'assets/d8.jpg' },
{ name: 'Slip dress, flat lay', where: 'Draft', len: '0:10', img: 'assets/d2.jpg' }
],
days: daily.map((v, i) => ({ h: Math.max(1, Math.round((v / max) * 70)) + 'px', tip: 'Oct ' + (i + 1) + ': ' + v + ' credits' })),
stages: stagesRaw.map(([name, v]) => ({ name, v: v.toLocaleString('en-US'), w: Math.round((v / top) * 100) + '%' })),
queue: [
{ name: 'Satin slip dress, shot 04', eta: '0:42', pct: '65%' },
{ name: 'Satin slip dress, shot 08', eta: '1:30', pct: '20%' }
]
};
}
}
</script>
<script type="module">import { mount } from './vendor/dc.js'; mount();</script>
</body>
</html>
