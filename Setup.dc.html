<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#5A5A5A}
@keyframes kyUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kyFade{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
header{animation:kyFade .5s ease both}
h1{animation:kyUp .6s .05s cubic-bezier(.2,.7,.2,1) both}
section,aside,figure,article{animation:kyUp .6s .12s cubic-bezier(.2,.7,.2,1) both}
section+section{animation-delay:.2s}
section+section+section{animation-delay:.28s}
aside{animation-delay:.24s}
a,button,label{transition:transform .18s ease,background-color .2s ease,box-shadow .2s ease,border-color .2s ease,color .2s ease}
button:not(:disabled):hover,a[href]:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(26,26,26,.08)}
button:not(:disabled):active,a[href]:active{transform:scale(.97);transition-duration:.08s}
img{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
a:hover img,button:hover img{transform:scale(1.04)}
:focus-visible{outline:2px solid #1A1A1A;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script id="dc-script" type="text/plain">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { look: 0, light: 0, room: 0, model: 0, modelC: false, board: 0 };
}
renderVals() {
const s = this.state;
const on = '1.5px solid #1A1A1A', off = '1px solid rgba(255,255,255,0.9)';
const F = '#D9D4CA', D = '#8A857C', T = '#1A1A1A';
const strip = (codes) => codes.split('').map((ch) => ({ f: 1, c: ch === 'f' ? F : ch === 'd' ? D : T }));
const looks = ['Bedroom haul', 'Studio white', 'Closet mirror', 'Warm apartment'];
const lookLight = [0, 1, 0, 2], lookRoom = [0, 1, 2, 3];
const lights = ['OVERCAST', 'SOFTBOX', 'GOLDEN HOUR'];
const rooms = ['BEDROOM', 'STUDIO', 'CLOSET', 'APARTMENT'];
const modelNames = ['Model A', 'Model B', 'Model C'];
const boardDefs = [
{ name: 'Haul + try-on', len: '15s', shots: 11, clips: 3, codes: 'tfdddtttttt' },
{ name: 'Flat lay only', len: '10s', shots: 8, clips: 2, codes: 'fddddddf' },
{ name: 'Try-on first', len: '15s', shots: 10, clips: 3, codes: 'ttttfddttt' }
];
const pickLook = (i) => () => this.setState({ look: i, light: lookLight[i], room: lookRoom[i] });
const pickModel = (i) => () => this.setState({ model: i });
const b = boardDefs[s.board];
return {
light: lights[s.light],
room: rooms[s.room],
cycleLight: () => this.setState({ light: (s.light + 1) % lights.length }),
cycleRoom: () => this.setState({ room: (s.room + 1) % rooms.length }),
look0: pickLook(0), look1: pickLook(1), look2: pickLook(2), look3: pickLook(3),
lb0: s.look === 0 ? on : off, lb1: s.look === 1 ? on : off, lb2: s.look === 2 ? on : off, lb3: s.look === 3 ? on : off,
model0: pickModel(0), model1: pickModel(1), model2: pickModel(2),
mb0: s.model === 0 ? on : off, mb1: s.model === 1 ? on : off, mb2: s.model === 2 ? on : off,
hasModelC: s.modelC, noModelC: !s.modelC,
addModel: () => this.setState({ modelC: true, model: 2 }),
boards: boardDefs.map((d, i) => ({ name: d.name, meta: d.len + ' · ' + d.shots + ' shots', border: s.board === i ? on : off, shots: strip(d.codes), pick: () => this.setState({ board: i }) })),
sumLook: looks[s.look],
sumModel: modelNames[s.model],
sumBoard: b.name,
sumLen: b.len,
sumShots: String(b.shots),
sumClips: String(b.clips)
};
}
}
